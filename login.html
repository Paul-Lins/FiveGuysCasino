<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Five Guys Casino Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<div class="auth-shell">
  <section class="auth-brand">
    <p class="eyebrow">Five Guys Casino</p>
    <h1>Five Guys Casino</h1>
    <div class="flow">
      <span>Have a problem with Gambling?</span><span>Call 1-800-GAMBLER</span>
    </div>
  </section>

  <section class="auth-card">
    <div class="logo">FGC</div>
    <h2>Sign In</h2>
    <p class="muted">Use your account to continue.</p>

    <form id="loginForm">
      <label>Email
        <input id="email" type="email" required>
      </label>
      <label>Password
        <input id="password" type="password" required>
      </label>
      <button type="submit" class="primary">Login</button>
      <div class="create-account">
        <button type="button" class="secondary" id="createAccountButton">Create Account</button>
      </div>
    </form>
    
    <p id="message" class="message"></p>

    <div class="demo-box">
      <strong>Demo Account</strong>
      <p>User: user@casino.local / User123!</p>
      <p>Admin: admin@casino.local / Admin123!</p>
    </div>
  </section>
</div>
<script src="login.js"></script>
</body>
</html>
