<!-- =========================
     BLACKJACK
     ========================= -->

<section class="game-container" id="blackjackGame">

    <h2>♠ Blackjack ♠</h2>

    <div class="blackjack-area">

        <div class="dealer-area">
            <h3>Dealer</h3>
            <div id="dealerCards" class="cards"></div>
            <p>Dealer Total: <span id="dealerTotal">?</span></p>
        </div>

        <div class="player-area">
            <h3>You</h3>
            <div id="playerCards" class="cards"></div>
            <p>Your Total: <span id="playerTotal">0</span></p>
        </div>

    </div>

    <p id="blackjackMessage">Press Deal to start!</p>

    <div class="game-buttons">
        <button id="blackjackDeal">Deal</button>
        <button id="blackjackHit" disabled>Hit</button>
        <button id="blackjackStand" disabled>Stand</button>
    </div>

</section>


<!-- =========================
     ROULETTE
     ========================= -->

<section class="game-container" id="rouletteGame">

    <h2>🎰 Roulette 🎰</h2>

    <div class="roulette-controls">

        <label for="rouletteColor">Choose a color:</label>

        <select id="rouletteColor">
            <option value="red">Red</option>
            <option value="black">Black</option>
            <option value="green">Green</option>
        </select>


        <label for="rouletteBet">How much do you want to bet?</label>

        <input
            type="number"
            id="rouletteBet"
            min="0"
            step="any"
            placeholder="Enter amount"
        >

        <button id="rouletteButton">Spin</button>

    </div>

    <div id="rouletteResult" class="roulette-result">
        <p>Make your choice and spin!</p>
    </div>

    <p id="rouletteMessage"></p>

</section>
