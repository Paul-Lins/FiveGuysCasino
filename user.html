<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Guys Casino</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="user-page">
    <header class="topbar">
        <div class="nav">
            <div class="brand-mark" aria-hidden="true">5G</div>
            <span>Welcome, <strong id= "userName">player</strong></span>
            <span>🪙 <strong id="chipBalance">0</strong> chips</span>
            <button id="addFundsButton" type="button">Add Funds</button>
            <button id="logoutButton" type="button">Logout</button>
        </div>
    </header>

    <section class="panel" id="addFundsPanel" hidden>
        <h2>Add Funds</h2>
        <label for="fundsPlayer">Assign to:</label>
        <select id="fundsPlayer"></select>
        <label for="fundsAmount">Amount:</label>
        <input type="number" id="fundsAmount" min="1" step="1" placeholder="Enter amount">
        <button id="fundsSubmit" type="button">Assign Funds</button>
        <button id="fundsCancel" type="button">Cancel</button>
        <p id="fundsMessage"></p>
    </section>

    <main class="dashboard">
        <section class="grid casino-table">
        <!--
        =========================
        BLACKJACK
        ========================= -->
        
            <section class="game-container" id="blackjackGame">

                <h2>♠ Blackjack ♠</h2>

                <div class="blackjack-area">

                    <div class="dealer-area">
                        <h3>Dealer</h3>
                        <div id="dealerCards" class="cards"></div>
                        <p>Dealer Total: <span id="dealerTotal">?</span></p>
                    </div>

                    <div class="player-area">
                        <h3>You</h3>
                        <div id="playerCards" class="cards"></div>
                        <p>Your Total: <span id="playerTotal">0</span></p>
                    </div>

                </div>

                <div class="roulette-controls blackjack-controls">
                    <label for="blackjackWager">How much do you want to bet?</label>
                    <input type="number" id="blackjackWager" min="1" step="1" placeholder="Enter amount">
                    <button id="blackjackWagerButton" type="button">Add Wager</button>
                </div>
                <p id="blackjackWagerStatus" aria-live="polite">No wager added.</p>
                <p id="blackjackMessage" role="status" aria-live="polite">Add a wager before dealing.</p>

                <div class="game-buttons">
                    <button id="blackjackDeal">Deal</button>
                    <button id="blackjackHit" disabled>Hit</button>
                    <button id="blackjackStand" disabled>Stand</button>
                </div>

            </section>

            <!-- =========================
            ROULETTE
            ========================= -->
            <section class="game-container" id="rouletteGame">

                <h2>🎡 Roulette 🎡</h2>

                <div class="roulette-controls">

                    <label for="rouletteColor">Choose a color:</label>

                    <select id="rouletteColor">
                        <option value="red">Red</option>
                        <option value="black">Black</option>
                        <option value="green">Green</option>
                    </select>


                    <label for="rouletteBet">How much do you want to bet?</label>

                    <input
                        type="number"
                        id="rouletteBet"
                        min="1"
                        step="1"
                        placeholder="Enter amount"
                    >

                    <button id="rouletteButton">Spin</button>

                </div>

                <div id="rouletteResult" class="roulette-result">
                    <p>Make your choice and spin!</p>
                </div>

                <p id="rouletteMessage"></p>

            </section>
        </section>

        <section class="grid">

            <div class="panel">
                <h2>Bet History</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Game</th>
                            <th>Wager</th>
                            <th>Result</th>
                            <th>Payout</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
                <div class="history-pagination">
                    <button id="historyPrevious" type="button" disabled>Previous</button>
                    <span id="historyPageStatus" aria-live="polite">Page 1 of 1</span>
                    <button id="historyNext" type="button" disabled>Next</button>
                </div>
            </div>

            <div class="panel">
                <div class="leaderboard-header">
                    <h2>Leaderboard</h2>
                    <button id="refreshLeaderboard" type="button">Refresh</button>
                </div>
                <ol id="leaderboardList"></ol>
            </div>

        </section>

    </main>
    <script src="app.js"></script>
</body>
</html>
